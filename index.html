
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Credit FMS</title>
<style>
:root{--bg:#f3f5fa;--cd:#fff;--tx:#17202e;--mu:#667389;--pr:#1f3864;--pt:#fff;--ac:#2f6fed;--bd:#e3e8f1;--ok:#2e7d32;--wa:#d9730d;--er:#d32f2f;--ye:#b58900;--hv:#f0f4fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{--bg:#0e1320;--cd:#182033;--tx:#e8ecf4;--mu:#9aa6bd;--pr:#7fa2e8;--pt:#0e1320;--ac:#6c9bff;--bd:#27324a;--hv:#202a40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:10px 20px;flex-wrap:wrap}
h1{font-size:16px;margin:0 8px 0 0;color:var(--pr);display:flex;gap:8px;align-items:center}h1 i{font-style:normal;background:var(--pr);color:var(--pt);width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
nav{display:flex;gap:2px;background:var(--hv);padding:3px;border-radius:11px;flex-wrap:wrap}nav .btn{border:0;background:none}nav .btn.on{background:var(--cd);color:var(--pr);font-weight:600;box-shadow:0 1px 3px #0002}
.btn{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 13px;border-radius:9px;cursor:pointer;transition:.15s}
.btn:hover{background:var(--hv)}.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn.on,.btn.pri{background:var(--pr);color:var(--pt);border-color:var(--pr)}.sp{flex:1}
main{max-width:1180px;margin:0 auto;padding:20px}.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}.w{grid-column:1/-1}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}.hi{margin:0;font-size:22px;color:var(--pr)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.kp{border-left:4px solid var(--ac);cursor:pointer;transition:.15s}.kp:hover{transform:translateY(-2px);box-shadow:0 4px 14px #0001}.kp.er{border-color:var(--er)}.kp.wa{border-color:var(--wa)}.kp.ok{border-color:var(--ok)}
.kv{font-size:26px;font-weight:700;color:var(--pr);line-height:1.2}.mu{color:var(--mu);font-size:12px}h3{margin:0 0 10px;font-size:14px;color:var(--pr)}
.row{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:8px}.row:hover{background:var(--hv)}.row:last-child{border:0}
.rw{display:grid;grid-template-columns:130px minmax(0,1.6fr) 140px 130px 90px;gap:12px}.rh{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);font-weight:600;cursor:default}.rh:hover{background:none}
@media(max-width:720px){.rw{grid-template-columns:1fr 1fr}.rh,.x{display:none}main{padding:12px}}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;color:#fff;background:var(--mu);white-space:nowrap}.b.er{background:var(--er)}.b.wa{background:var(--wa)}.b.ye{background:var(--ye)}.b.ok{background:var(--ok)}
.bar{height:8px;border-radius:9px;background:var(--hv);overflow:hidden;flex:1;min-width:60px}.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--cd);color:var(--tx)}label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.fl{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.fl input,.fl select{width:auto;flex:1;min-width:140px}
.ov{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:24px 10px;overflow:auto;animation:in .2s}
.md{background:var(--cd);border-radius:16px;width:min(780px,100%);padding:20px;border:1px solid var(--bd)}.md h2{margin:0 0 4px;font-size:18px;color:var(--pr)}
.chip{cursor:pointer;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;display:flex;justify-content:space-between;gap:8px;user-select:none;transition:.15s}.chip:hover{border-color:var(--ac)}.chip.R{background:var(--ok);color:#fff;border-color:var(--ok)}.chip.N{opacity:.5}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pr);color:var(--pt);padding:9px 16px;border-radius:99px;z-index:60;opacity:0;transition:.25s;pointer-events:none}#t.s{opacity:1}
table{border-collapse:collapse;width:100%}td,th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--bd)}
</style></head><body>
<header><h1><i>📋</i>Credit FMS</h1><nav id="nav"></nav><span class="sp"></span><button class="btn pri" data-a="new">＋ New file <small>(N)</small></button><button class="btn" data-a="theme" aria-label="Toggle theme">◐</button></header>
<main id="m"></main><div id="t" role="status"></div>
<script>
const KEY='creditfms_v1',$=s=>document.querySelector(s);
const DEF={set:{prefix:'AB',branch:'AKU',rem:90,soon:3,title:'Amana Bank PLC | Akurana Branch',bm:'',pin:'1234',
stages:'Pipeline|1|14|doc\nOngoing - New|1|14|doc\nOngoing - Renewal|1|10|doc\nApproved|1|5|disb\nDocumentation|1|7|disb\nSigned|1|3|disb\nFRS Raised|1|3|frs\nQueries Raised|1|3|frs\nQueries Replied|1|3|frs\nDisbursed|0|0|done\nPost Mortem|0|0|done\nDeclined|0|0|done\nWithdrawn|0|0|done',
products:'Leasing|IJ\nHousing|DMH\nWorking Capital DM|WCDM\nCash Back|WC-DMH\nSAF|EM\nSolar Finance|SOL\nEducation|EDU\nLG|LG\nDM + EC|DMEC\nOther|OTH',
officers:'Ihshan|\nShamil|\nMukrim Mohamed|',pend:'Credit Team\nBranch Manager\nRelationship Officer\nCustomer\nHead Office CM\nLegal\nShariah\nValuer\nFRS / Operations\nOther',
segs:'Business Banking\nCorporate\nSME',docT:'Renewal\nNew\nAmendment\nOther',cm:'Not Started\nIn Progress\nSubmitted\nApproved\nReturned',
docs:'Facility Application\nBR & NIC\nCRIB\nBank Statements\nReferral\nBasic Interview\nAccount Opening\nDeed & Plan\nTitle Report\nManagement Accounts\nValuation Report\nDebtor & Creditor Statement\nStock Statement\nLast 6 Months Sales & Purchases',
disb:'CM Approval\nPricing Approval\nCRIB Clearance\nAccount Opening\nFOL\nLocal Authority Documents\nLegal Clearance\nMB Execution\nShariah Clearance\nAny Other Condition'},files:[]};
let DB;try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}DB=DB||DEF;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('Could not save in this browser')}};
const S=DB.set,L=k=>S[k].split('\n').map(x=>x.trim()).filter(Boolean),P=k=>L(k).map(x=>x.split('|'));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10),dd=d=>d?d.split('-').reverse().join('/'):'',n0=v=>Number(v)||0,rs=v=>v?Number(v).toLocaleString('en-LK'):'';
const days=d=>d?Math.round((new Date(d)-new Date(today()))/864e5):null;
const stg=n=>{const r=P('stages').find(x=>x[0]==n);return r?{act:r[1]=='1',sla:n0(r[2]),rt:r[3]}:{act:false,sla:0,rt:'done'}};
const pct=(f,k,items)=>{const it=items,c=f[k]||{};const ap=it.filter(i=>c[i]!='N').length;return ap?Math.round(it.filter(i=>c[i]=='R').length/ap*100):null};
function calc(f){const s=stg(f.stage),pd=s.act&&f.stageDate?Math.max(0,-days(f.stageDate)):null,dueD=s.act&&f.due?days(f.due):null;let al='';
if(f.docType=='Other'&&!f.docOther)al=['er',"Specify ‘Other’"];else if(s.act){if(dueD!=null&&dueD<0)al=['er','Action overdue'];else if(pd!=null&&s.sla&&pd>s.sla)al=['wa','SLA breached'];else if(dueD!=null&&dueD<=S.soon)al=['ye','Due soon']}
const rm=[];[['renew','Renewal'],['cbs','Cash build-up settlement']].forEach(([k,n])=>{const d=days(f[k]);if(f[k]&&d<=S.rem)rm.push(d<0?`${n} overdue ${-d}d`:`${n} due in ${d}d`)});
return{s,pd,dueD,al,rm:rm.join(' | '),rd:Math.min(...['renew','cbs'].map(k=>f[k]?days(f[k]):1e9)),dp:pct(f,'doc',L('docs')),sp:pct(f,'dis',L('disb'))}}
function ref(prod,date,skip){const code=(P('products').find(x=>x[0]==prod)||[])[1];if(!code||!date)return'';const y=date.slice(0,4);
return`${S.prefix}/${code}/${S.branch}/${y}/${String(DB.files.filter(f=>f.id!=skip&&f.product==prod&&(f.received||'').slice(0,4)==y).length+1).padStart(3,'0')}`}
let view='dash',unlocked=false;
const TABS=[['dash','Dashboard'],['files','Files'],['alerts','Alerts'],['rem','Reminders'],['set','Settings']];
function nav(){$('#nav').innerHTML=TABS.map(([k,n])=>`<button class="btn ${view==k?'on':''}" data-a="v:${k}">${n}</button>`).join('')}
const badge=a=>a?`<span class="b ${a[0]}">${a[1]}</span>`:'';
const rowH=f=>{const c=calc(f);return`<div class="row rw" data-a="open:${f.id}"><b>${esc(f.ref)}</b><span>${esc(f.customer)}<br><span class="mu">${esc(f.product)} · ${esc(f.officer)}</span></span><span><span class="b">${esc(f.stage)}</span></span><span>${badge(c.al)||'<span class="mu">—</span>'}</span><span class="mu x">${c.pd!=null?c.pd+' days':''}</span></div>`};
const RH='<div class="row rw rh"><span>Ref</span><span>Customer</span><span>Stage</span><span>Alert</span><span class="x">In stage</span></div>';
function dash(){const F=DB.files,C=F.map(f=>[f,calc(f)]),A=C.filter(x=>x[1].s.act),mo=today().slice(0,7),sum=a=>a.reduce((s,x)=>s+n0(x.amount),0),
od=A.filter(x=>x[1].dueD<0).length,sl=A.filter(x=>x[1].al&&x[1].al[1]=='SLA breached').length,rmn=C.filter(x=>x[1].rm).length,dm=F.filter(f=>(f.disbDate||'').startsWith(mo)),
mx=Math.max(1,...P('stages').map(s=>F.filter(f=>f.stage==s[0]).length)),mo2=Math.max(1,...L('officers').map(o=>A.filter(x=>x[0].officer==o.split('|')[0]).length)),h=new Date().getHours();
const K=(i,n,v,sub,cl,go)=>`<div class="c kp ${cl||''}" data-a="v:${go||'files'}"><div class="mu">${i} ${n}</div><div class="kv">${v}</div><div class="mu">${sub}</div></div>`;
return`<div class="top"><div><h2 class="hi">${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}</h2><div class="mu">${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div></div><div class="fl" style="margin:0"><button class="btn pri" data-a="status">✉ Email file status</button><button class="btn" data-a="mailall">✉ Reminders</button><button class="btn" data-a="csv">⬇ CSV</button><button class="btn" data-a="bk">Backup</button><button class="btn" data-a="rs">Restore</button></div></div>
<div class="g k">${K('📂','Active files',A.length,'Rs. '+(rs(sum(A.map(x=>x[0])))||0)+' in pipeline')}${K('⏰','Overdue actions',od,'follow up now',od?'er':'ok','alerts')}${K('⚠️','SLA breached',sl,'too long in a stage',sl?'wa':'ok','alerts')}${K('🔔','Reminders',rmn,'renewal / cash build-up','','rem')}${K('✅','Disbursed this month',dm.length,'Rs. '+(rs(dm.reduce((a,f)=>a+n0(f.disbAmt),0))||0),'ok')}</div>
<div class="g g2"><div class="c w"><h3>Needs attention</h3>${RH}${C.filter(x=>x[1].al).sort((a,b)=>(a[1].dueD??9e3)-(b[1].dueD??9e3)).slice(0,6).map(x=>rowH(x[0])).join('')||'<p class="mu">All clear — nothing overdue.</p>'}</div>
<div class="c"><h3>Pipeline by stage</h3>${P('stages').map(s=>{const m=F.filter(f=>f.stage==s[0]);return`<div class="row" data-a="stage:${esc(s[0])}"><span style="width:130px">${esc(s[0])}</span><span class="bar"><i style="width:${m.length/mx*100}%"></i></span><b style="width:24px;text-align:right">${m.length}</b><span class="mu" style="width:90px;text-align:right">${rs(sum(m))}</span></div>`}).join('')}</div>
<div class="c"><h3>Due in the next 7 days</h3>${A.filter(x=>x[0].due&&x[1].dueD<=7).sort((a,b)=>a[0].due<b[0].due?-1:1).slice(0,7).map(x=>`<div class="row" data-a="open:${x[0].id}"><span style="flex:1">${esc(x[0].customer)}<br><span class="mu">${esc(x[0].next||x[0].stage)}</span></span><span class="b ${x[1].dueD<0?'er':x[1].dueD<=S.soon?'ye':''}">${x[1].dueD<0?'Overdue ':''}${dd(x[0].due)}</span></div>`).join('')||'<p class="mu">Nothing due this week.</p>'}</div>
<div class="c"><h3>Officer workload</h3>${L('officers').map(o=>o.split('|')[0]).map(o=>{const m=A.filter(x=>x[0].officer==o);return`<div class="row" data-a="off:${esc(o)}"><span style="width:120px">${esc(o)}</span><span class="bar"><i style="width:${m.length/mo2*100}%"></i></span><b>${m.length}</b><span class="mu" style="width:80px;text-align:right">${m.filter(x=>x[1].dueD<0).length} overdue</span></div>`}).join('')}</div>
<div class="c"><h3>Active files by product</h3>${P('products').map(p=>{const m=A.filter(x=>x[0].product==p[0]);return m.length?`<div class="row"><span style="flex:1">${esc(p[0])}</span><b>${m.length}</b><span class="mu" style="width:100px;text-align:right">${rs(sum(m.map(x=>x[0])))}</span></div>`:''}).join('')||'<p class="mu">No active files.</p>'}</div></div><p class="mu" style="margin-top:14px">💾 Data is saved in this browser on this device only — use Backup regularly.</p>`}
let q='',fs='',fo='';
function files(){return`<div class="fl"><input id="q" placeholder="Search CIF / Ref / name…  ( / )" value="${esc(q)}"><select id="fs"><option value="">All stages</option>${P('stages').map(s=>`<option ${fs==s[0]?'selected':''}>${esc(s[0])}</option>`).join('')}</select><select id="fo"><option value="">All officers</option>${L('officers').map(o=>o.split('|')[0]).map(o=>`<option ${fo==o?'selected':''}>${esc(o)}</option>`).join('')}</select></div><div class="c">${RH}<div id="fl">${fl()}</div></div>`}
const fl=()=>{const t=q.toLowerCase(),r=DB.files.filter(f=>(!fs||f.stage==fs)&&(!fo||f.officer==fo)&&(!t||[f.ref,f.customer,f.cif,f.stage,f.officer].join('|').toLowerCase().includes(t))).reverse();return r.map(rowH).join('')||'<p class="mu">No files found.</p>'};
function alerts(){const r=DB.files.map(f=>[f,calc(f)]).filter(x=>x[1].al).sort((a,b)=>(a[1].dueD??9e3)-(b[1].dueD??9e3));return`<div class="c"><h3>Pending alerts (${r.length})</h3>${RH}${r.map(x=>rowH(x[0])).join('')||'<p class="mu">All clear 🎉</p>'}</div>`}
function rem(){const r=DB.files.map(f=>[f,calc(f)]).filter(x=>x[1].rm).sort((a,b)=>a[1].rd-b[1].rd);return`<div class="c"><h3>Renewal / cash build-up reminders (${r.length})</h3>${r.map(x=>`<div class="row" data-a="open:${x[0].id}"><b style="min-width:110px">${esc(x[0].ref)}</b><span style="flex:1">${esc(x[0].customer)}</span><span class="b wa">${x[1].rm}</span></div>`).join('')||'<p class="mu">Nothing due within the window.</p>'}</div><div class="fl"><button class="btn pri" data-a="mailall">✉ Email reminders per officer</button></div>`}
const SETS=[['stages','Stages  (name|active 1/0|SLA days|opens: doc / disb / frs / done)',8],['products','Products  (name|ref code)',8],['officers','Officers  (name|e-mail)',5],['pend','Pending with',5],['segs','Segments',3],['docT','Documentation types (keep “Other”)',3],['cm','CM status',4],['docs','Document checklist items',8],['disb','Disbursement checklist items',8]];
function settings(){if(!unlocked)return`<div class="c" style="max-width:340px"><h3>🔒 Settings are protected</h3><input id="pin" type="password" placeholder="PIN" autocomplete="off"><div class="fl"><button class="btn pri" data-a="unlock">Unlock</button></div><p class="mu">Default PIN: 1234 — change it after unlocking.</p></div>`;
const I=(k,n,t='text')=>`<div><label>${n}</label><input data-s="${k}" type="${t}" value="${esc(S[k])}"></div>`;
return`<div class="c"><h3>General</h3><p class="mu">Officer e-mails below are offered as CC (credit staff) each time you send.</p><div class="f">${I('prefix','Ref prefix')}${I('branch','Branch code')}${I('rem','Reminder window (days)','number')}${I('soon','‘Due soon’ days','number')}${I('title','Title (e-mails)')}${I('bm','Branch Manager e-mail (CC)','email')}${I('cc','Extra CC e-mails (comma-separated)')}<div><label>E-mail body</label><select data-s="mstyle"><option value="plain" ${S.mstyle!='styled'?'selected':''}>Plain text — opens ready to Send</option><option value="styled" ${S.mstyle=='styled'?'selected':''}>Designed — copied, press Ctrl+V</option></select></div>${I('pin','PIN')}</div></div>
<div class="g g2" style="margin-top:12px">${SETS.map(([k,n,r])=>`<div class="c"><label>${n}</label><textarea data-s="${k}" rows="${r}">${esc(S[k])}</textarea></div>`).join('')}</div>
<div class="fl"><button class="btn pri" data-a="saveset">Save settings</button><button class="btn" data-a="lock">Lock</button></div>`}
function render(){nav();$('#m').innerHTML={dash,files,alerts,rem,set:settings}[view]()}
function toast(m){const t=$('#t');t.textContent=m;t.className='s';clearTimeout(t.h);t.h=setTimeout(()=>t.className='',2200)}
function modal(h){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="md" role="dialog" aria-modal="true">${h}</div>`;o.onclick=e=>{if(e.target==o)o.remove()};document.body.append(o);const i=o.querySelector('input,select');i&&i.focus();return o}
const close=()=>document.querySelectorAll('.ov').forEach(o=>o.remove());
const FD={received:['Date received','date'],customer:['Customer / business','text'],cif:['CIF','text'],segment:['Segment','sel','segs'],product:['Product','sel','products'],amount:['Amount requested (Rs.)','number'],exposure:['Existing exposure (Rs.)','number'],stage:['Stage','sel','stages'],stageDate:['Stage date','date'],officer:['Responsible officer','sel','officers'],pending:['Pending with','sel','pend'],da:['DA level','text'],cm:['CM status','sel','cm'],apprRef:['Approval ref','text'],apprDate:['Approval date','date'],docType:['Documentation type','sel','docT'],docOther:['If Other – specify','text'],next:['Next action','text'],due:['Action due date','date'],blocker:['Main blocker / missing item','text'],frs:['FRS ticket no.','text'],frsDate:['FRS raised date','date'],disbDate:['Disbursed date','date'],disbAmt:['Disbursed amount (Rs.)','number'],renew:['Renewal due date','date'],cbs:['Cash build-up settlement date','date'],pm:['Post-mortem notes','text'],remarks:['Remarks','text']};
const RT={doc:'stage stageDate pending officer da cm apprRef apprDate next due blocker remarks',disb:'stage stageDate docType docOther pending officer next due blocker frs frsDate remarks',frs:'stage stageDate pending frs frsDate disbDate disbAmt next due blocker remarks',done:'stage stageDate disbDate disbAmt renew cbs pm remarks'};
const NEW='received customer cif segment product amount exposure stage stageDate officer pending da next due renew cbs remarks';
function field(k,v){const[n,t,s]=FD[k];const o=t=='sel'?`<select data-k="${k}"><option></option>${L(s).map(x=>x.split('|')[0]).map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input data-k="${k}" type="${t}" value="${esc(v)}">`;return`<div><label>${n}${/customer|product|stage$|officer|received/.test(k)?' *':''}</label>${o}</div>`}
function newFile(){const d={received:today(),stage:P('stages')[0][0],stageDate:today()};const o=modal(`<h2>New file</h2><div class="f"><div><label>Ref no. (auto — editable)</label><input id="ref"></div>${NEW.split(' ').map(k=>field(k,d[k]||'')).join('')}</div><div class="fl"><button class="btn pri" data-a="savenew">Save file</button><button class="btn" data-a="x">Cancel</button></div>`);
let ed=false;const r=o.querySelector('#ref'),up=()=>{if(!ed)r.value=ref(o.querySelector('[data-k=product]').value,o.querySelector('[data-k=received]').value)};r.oninput=()=>ed=true;o.addEventListener('change',up)}
